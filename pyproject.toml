[project]
name = "statistics-ml-dl"
version = "0.2.0"
description = "Comprehensive Statistics for Machine Learning & Deep Learning - React Edition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.14.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "jupyter>=1.0.0",
    "ipywidgets>=8.0.0",
    "pymc>=5.0.0",
    "arviz>=0.15.0",
    "hmmlearn>=0.3.0",
    "networkx>=3.1",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
